<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b0b;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      user-select: none;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      width: 100%;
      max-width: 340px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    h1 { font-size: 2.4rem; font-weight: 800; color: #ff4747; letter-spacing: -1px; }

    .scores { display: flex; gap: 0.5rem; }

    .score-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.35rem 0.75rem;
      text-align: center;
      min-width: 66px;
    }
    .score-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; opacity: 0.4; }
    .score-value { font-size: 1.1rem; font-weight: 700; }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 9px;
      width: 100%;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 7px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(0.9rem, 4vw, 1.3rem);
      transition: background 0.08s;
    }

    .cell[data-val="2"]    { background:#1e2a3a; color:#c8d8e8; }
    .cell[data-val="4"]    { background:#1a3050; color:#d0e0f0; }
    .cell[data-val="8"]    { background:#1a4a7a; color:#fff; }
    .cell[data-val="16"]   { background:#6a2fa0; color:#fff; }
    .cell[data-val="32"]   { background:#a02828; color:#fff; }
    .cell[data-val="64"]   { background:#c0392b; color:#fff; }
    .cell[data-val="128"]  { background:#e74c3c; color:#fff; font-size: clamp(0.75rem, 3.2vw, 1.1rem); }
    .cell[data-val="256"]  { background:#e67e22; color:#fff; font-size: clamp(0.75rem, 3.2vw, 1.1rem); }
    .cell[data-val="512"]  { background:#f39c12; color:#111; font-size: clamp(0.75rem, 3.2vw, 1.1rem); }
    .cell[data-val="1024"] { background:#f1c40f; color:#111; font-size: clamp(0.6rem, 2.8vw, 0.95rem); }
    .cell[data-val="2048"] { background:#2ecc71; color:#fff; font-size: clamp(0.6rem, 2.8vw, 0.95rem); }

    .cell.new  { animation: pop 0.12s ease; }
    @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .footer { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; }

    #message { font-size: 0.9rem; font-weight: 700; min-height: 1.2rem; }
    .win  { color: #2ecc71; }
    .lose { color: #ff4747; }

    button {
      background: rgba(255,71,71,0.12);
      color: #ff4747;
      border: 1px solid rgba(255,71,71,0.25);
      border-radius: 8px;
      padding: 0.45rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: rgba(255,71,71,0.22); }

    .hint { font-size: 0.65rem; opacity: 0.25; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="score-label">SCORE</div><div class="score-value" id="score">0</div></div>
      <div class="score-box"><div class="score-label">BEST</div><div class="score-value" id="best">0</div></div>
    </div>
  </div>

  <div id="board"></div>

  <div class="footer">
    <div id="message"></div>
    <button id="btn-new">New Game</button>
    <div class="hint">Arrow keys · WASD · Swipe</div>
  </div>
</div>

<script>
  const SIZE = 4;
  let grid, score, best = +localStorage.getItem('b2048') || 0, won = false;

  function init() {
    grid = Array(SIZE * SIZE).fill(0);
    score = 0; won = false;
    msg('');
    addTile(); addTile();
    render();
  }

  function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    grid.forEach(v => {
      const c = document.createElement('div');
      c.className = 'cell';
      if (v) { c.dataset.val = v > 2048 ? 'hi' : v; c.textContent = v; }
      board.appendChild(c);
    });
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
  }

  function addTile(animate = true) {
    const empty = grid.reduce((a, v, i) => v === 0 ? [...a, i] : a, []);
    if (!empty.length) return;
    const i = empty[Math.floor(Math.random() * empty.length)];
    grid[i] = Math.random() < 0.9 ? 2 : 4;
    if (animate) {
      const cells = document.getElementById('board').children;
      cells[i].classList.add('new');
    }
  }

  function slideRow(row) {
    let r = row.filter(v => v), gain = 0, merged = [];
    for (let i = 0; i < r.length; i++) {
      if (i + 1 < r.length && r[i] === r[i + 1]) {
        const v = r[i] * 2;
        merged.push(v); gain += v;
        if (v === 2048 && !won) { won = true; msg('🎉 You reached 2048!', 'win'); }
        i++;
      } else merged.push(r[i]);
    }
    while (merged.length < SIZE) merged.push(0);
    return { row: merged, gain };
  }

  function move(dir) {
    const old = [...grid]; let gain = 0;
    if (dir === 'left' || dir === 'right') {
      for (let r = 0; r < SIZE; r++) {
        let row = grid.slice(r * 4, r * 4 + 4);
        if (dir === 'right') row.reverse();
        const { row: nr, gain: g } = slideRow(row);
        if (dir === 'right') nr.reverse();
        nr.forEach((v, c) => grid[r * 4 + c] = v);
        gain += g;
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        let col = [0,1,2,3].map(r => grid[r * 4 + c]);
        if (dir === 'down') col.reverse();
        const { row: nc, gain: g } = slideRow(col);
        if (dir === 'down') nc.reverse();
        nc.forEach((v, r) => grid[r * 4 + c] = v);
        gain += g;
      }
    }
    if (grid.some((v, i) => v !== old[i])) {
      score += gain;
      if (score > best) { best = score; localStorage.setItem('b2048', best); }
      addTile();
      render();
      if (!canMove()) msg('Game over!', 'lose');
    }
  }

  function canMove() {
    if (grid.includes(0)) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r * 4 + c];
        if (c < SIZE - 1 && grid[r * 4 + c + 1] === v) return true;
        if (r < SIZE - 1 && grid[(r + 1) * 4 + c] === v) return true;
      }
    return false;
  }

  function msg(text, cls = '') {
    const el = document.getElementById('message');
    el.textContent = text; el.className = cls;
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  // Touch / swipe
  let tx, ty;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 30 || Math.abs(dy) > 30)
      Math.abs(dx) > Math.abs(dy) ? move(dx > 0 ? 'right' : 'left') : move(dy > 0 ? 'down' : 'up');
  }, { passive:true });

  document.getElementById('btn-new').onclick = init;
  init();
</script>
</body>
</html>
